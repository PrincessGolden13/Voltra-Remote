[platformio]
default_envs = prototype_21

; Intentionally blocked until the physical board is identified.
; This is an ESP32-S3 compile candidate, NOT a confirmed board/pinout.
[env:prototype_21]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
extra_scripts = pre:tools/require_board_validation.py
build_src_filter = +<main.cpp> +<controller/> +<protocol/>
monitor_speed = 115200

; Physical display/input validation with synthetic VOLTRAs only.
; User authorized the JC3636K518 working target on October 11.
[env:guition_k5_offline]
extra_scripts = pre:tools/build_metadata.py
platform = espressif32@6.12.0
framework = arduino
board = guition_k5
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = config/guition_offline_partitions.csv
build_unflags = -std=gnu++11 -fno-exceptions
build_flags =
    -std=gnu++17
    -fexceptions
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DVOLTRA_OFFLINE=1
    -DVOLTRA_SIMULATOR=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I config
    -I simulator
build_src_filter = +<guition_main.cpp> +<controller/> +<protocol/> +<ui/> +<hardware/boards/guition_k5/>
lib_deps = lvgl/lvgl@9.3.0
monitor_speed = 115200
upload_speed = 115200

; Normal firmware never compiles or links MockTransport / MockVoltra.
[env:guition_k5_normal]
extends = env:guition_k5_offline
build_flags =
    -std=gnu++17
    -fexceptions
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DVOLTRA_PHYSICAL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I config
build_src_filter = +<guition_main.cpp> +<controller/> +<protocol/> +<ui/> +<network/Esp32WifiSetup.cpp> +<update/Esp32FirmwareUpdate.cpp> +<ble/NimBleTransport.cpp> +<hardware/boards/guition_k5/Board.cpp> +<hardware/boards/guition_k5/FirmwareIdentity.cpp>
lib_deps =
    lvgl/lvgl@9.3.0
    h2zero/NimBLE-Arduino@2.3.6

; Published builds must never embed local diagnostic identities/configuration.
[env:guition_k5_release]
extends = env:guition_k5_normal
build_flags = ${env:guition_k5_normal.build_flags} -DVOLTRA_PUBLIC_BUILD=1
